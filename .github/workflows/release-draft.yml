name: Build PC release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (must match package.json version, for example v2.0.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-draft:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid tag: $env:RELEASE_TAG (expected vX.Y.Z)" }
          gh release view $env:RELEASE_TAG --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists; choose a new tag" }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run release regression tests
        shell: pwsh
        run: |
          $tests = @(
            'test:ssrf', 'test:net-guard', 'test:hardening', 'test:pro',
            'test:pro-ipc', 'test:media', 'test:classification',
            'test:secrets:audit', 'test:backup', 'test:update-guard',
            'test:manifest-signature', 'test:epg-stream',
            'test:classification-parity', 'test:player-engine',
            'test:multiview-overlay', 'test:bugfix'
          )
          foreach ($test in $tests) {
            npm run $test
            if ($LASTEXITCODE -ne 0) { throw "Release regression failed: $test" }
          }

      - name: Build Windows x64 packages
        run: npm run dist -- --publish never

      - name: Verify Windows package outputs
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $artifacts = @(
            "dist/v$version/GomizPlayer-PRO-IPTV-Setup-$version.exe",
            "dist/v$version/GomizPlayer-PRO-IPTV-Portable-$version.exe"
          )
          foreach ($artifact in $artifacts) {
            if (!(Test-Path -LiteralPath $artifact)) { throw "Release artifact missing: $artifact" }
          }

      - name: Validate tag and sign updater manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $env:RELEASE_TAG does not match package version $version" }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_PRIVATE_KEY)) { throw 'Repository secret UPDATE_SIGNING_PRIVATE_KEY is required' }
          $manifest = 'dist/latest.yml'
          if (!(Test-Path -LiteralPath $manifest)) { throw 'electron-builder did not create dist/latest.yml' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'gomiz-update-signing-key.pem'
          try {
            [IO.File]::WriteAllText($keyPath, $env:UPDATE_SIGNING_PRIVATE_KEY, [Text.Encoding]::ASCII)
            node scripts/sign-update-manifest.js $manifest $keyPath
            if ($LASTEXITCODE -ne 0) { throw 'Manifest signing failed' }
            npm run verify:release-manifest -- $manifest
            if ($LASTEXITCODE -ne 0) { throw 'Manifest does not match the app embedded public key' }
          } finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Create draft release for review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notesText = @"
          GomizPlayer PRO IPTV $version — Windows x64

          Windows release with Setup and portable builds, blockmap, and an Ed25519-signed `latest.yml` update manifest. The app verifies the manifest signature and artifact hashes before downloading updates.

          Windows executables are not Authenticode-signed; Windows may display an unknown-publisher warning.

          ---

          إصدار GomizPlayer PRO IPTV $version — Windows x64

          إصدار Windows يتضمن نسخة Setup ونسخة Portable وملف blockmap وبيان `latest.yml` للتحديث الموقّع باستخدام Ed25519. يتحقق التطبيق من توقيع البيان وبصمات الملفات قبل تنزيل التحديثات.

          ملفات Windows التنفيذية غير موقعة بـ Authenticode؛ قد يعرض Windows تحذيراً بأن الناشر غير معروف.
          "@
          [IO.File]::WriteAllText($notes, $notesText, [Text.UTF8Encoding]::new($false))
          $assets = @(
            "dist/v$version/GomizPlayer-PRO-IPTV-Setup-$version.exe",
            "dist/v$version/GomizPlayer-PRO-IPTV-Setup-$version.exe.blockmap",
            "dist/v$version/GomizPlayer-PRO-IPTV-Portable-$version.exe",
            'dist/latest.yml'
          )
          foreach ($asset in $assets) { if (!(Test-Path -LiteralPath $asset)) { throw "Release asset missing: $asset" } }
          gh release create $env:RELEASE_TAG --draft --target $env:GITHUB_SHA --title "GomizPlayer PRO IPTV v$version (Windows)" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub draft release creation failed' }
          gh release upload $env:RELEASE_TAG @assets
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release asset upload failed' }
